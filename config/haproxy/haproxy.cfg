global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3

# Panel de estadisticas HTTP: http://localhost:8404/stats
listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

# Metricas Prometheus nativas de HAProxy: http://localhost:8405/metrics
frontend prometheus_metrics
    mode http
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }
    no log

# ---- ESCRITURA (puerto 5000): solo debe recibir tráfico el nodo PRIMARIO ----
# El healthcheck Node.js de cada nodo responde "primary" o "replica" segun
# pg_is_in_recovery(). HAProxy solo marca "UP" al server cuyo healthcheck
# devuelve exactamente "primary". node2/node3 quedan como backup: si se
# promueve una réplica a primario (failover manual), HAProxy la detecta y
# enruta automáticamente las escrituras hacia ella.
frontend write_frontend
    bind *:5000
    default_backend write_backend

backend write_backend
    option httpchk GET /
    http-check expect string primary
    server node1 db-node1:5432 check port 8008 inter 3s fall 2 rise 2
    server node2 db-node2:5432 check port 8008 inter 3s fall 2 rise 2 backup
    server node3 db-node3:5432 check port 8008 inter 3s fall 2 rise 2 backup

# ---- LECTURA (puerto 5001): balanceo round-robin entre las réplicas ----
frontend read_frontend
    bind *:5001
    default_backend read_backend

backend read_backend
    balance roundrobin
    option httpchk GET /
    http-check expect string replica
    server node2 db-node2:5432 check port 8008 inter 3s fall 2 rise 2
    server node3 db-node3:5432 check port 8008 inter 3s fall 2 rise 2
    server node1 db-node1:5432 check port 8008 inter 3s fall 2 rise 2 backup
